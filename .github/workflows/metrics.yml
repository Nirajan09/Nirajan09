name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC (11:45 NPT)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Dark Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Nirajan09
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Kathmandu
          output_action: none
          filename: github-metrics-dark.svg
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_lines: yes
          extras_css: |
            svg {
              background-color: #080C14 !important;
              border-radius: 12px;
              border: 1px solid #1E293B;
            }
            h2.field {
              color: #00F2FE !important;
            }
            div.field {
              color: #CBD5E1 !important;
            }

      - name: Generate Light Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Nirajan09
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Kathmandu
          output_action: none
          filename: github-metrics-light.svg
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_lines: yes
          extras_css: |
            svg {
              background-color: #F8FAFC !important;
              border-radius: 12px;
              border: 1px solid #E2E8F0;
            }
            h2.field {
              color: #0284C7 !important;
            }
            div.field {
              color: #334155 !important;
            }

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          sudo cp /metrics_renders/github-metrics-dark.svg dist/github-metrics-dark.svg
          sudo cp /metrics_renders/github-metrics-light.svg dist/github-metrics-light.svg

      - name: Deploy metrics SVGs to metrics branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
