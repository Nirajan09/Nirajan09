name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC (11:45 NPT)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    if: "${{ secrets.METRICS_TOKEN != '' }}"
    timeout-minutes: 10
    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nirajan09
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kathmandu
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update github metrics [skip ci]"
          filename: github-metrics.svg
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_lines: yes

