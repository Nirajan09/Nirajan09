<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 16" width="100%" height="16" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base track line (dark & light safe) -->
  <line x1="20" y1="8" x2="810" y2="8" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Traveling glow beam -->
  <rect x="-180" y="7" width="180" height="2" rx="1" fill="url(#divGrad)" filter="url(#divGlow)">
    <animate attributeName="x" from="-180" to="830" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Center node with pulse -->
  <circle cx="415" cy="8" r="2.5" fill="#8B5CF6">
    <animate attributeName="r" values="2;3.5;2" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
