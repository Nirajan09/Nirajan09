<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="p4BorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706">
        <animate attributeName="stop-color" values="#D97706;#7C3AED;#0284C7;#D97706" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#0284C7;#D97706;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#D97706;#7C3AED;#0284C7" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="p4ScanLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .scan {
      animation: sweep 6s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.15; }
      80% { opacity: 0.15; }
      100% { transform: translateY(260px); opacity: 0; }
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="828" height="258" rx="14" fill="#F8FAFC" stroke="url(#p4BorderLight)" stroke-width="1.8"/>

  <!-- Scanning line -->
  <rect x="2" y="0" width="826" height="2" fill="url(#p4ScanLight)" class="scan"/>

  <!-- Header: Status & Index -->
  <g class="mono" font-size="11">
    <rect x="24" y="22" width="245" height="24" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <circle cx="36" cy="34" r="4" fill="#D97706"/>
    <text x="48" y="38" fill="#B45309" font-weight="700" letter-spacing="0.5">PROJECT_04 // STATUS: CASE STUDY</text>

    <text x="806" y="38" fill="#64748B" text-anchor="end" font-weight="600">CLIENT CASE STUDY · VYOMITE</text>
  </g>

  <!-- Title & Cursor -->
  <g class="mono">
    <text x="24" y="82" fill="#0F172A" font-size="21" font-weight="700" letter-spacing="-0.5">
      Travel &amp; Tourism Management Platform<tspan fill="#D97706" class="cursor">_</tspan>
    </text>
    <text x="24" y="108" fill="#475569" font-size="13" font-weight="500">
      Tour management platform with 3-step trip planner, encrypted passports, and Celery tasks.
    </text>
  </g>

  <!-- 3 Feature Chips -->
  <g class="mono" font-size="11">
    <rect x="24" y="132" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="36" cy="147" r="3" fill="#0284C7"/>
    <text x="46" y="151" fill="#1E293B" font-weight="600">3-Step Trip Planner &amp; Departures</text>

    <rect x="299" y="132" width="250" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="311" cy="147" r="3" fill="#D97706"/>
    <text x="321" y="151" fill="#1E293B" font-weight="600">Celery + Beat Background Tasks</text>

    <rect x="559" y="132" width="247" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="571" cy="147" r="3" fill="#7C3AED"/>
    <text x="581" y="151" fill="#1E293B" font-weight="600">Fernet Passports · MFA · 4 RBAC</text>
  </g>

  <!-- Stack Pills Row -->
  <g class="mono" font-size="10.5">
    <rect x="24" y="194" width="82" height="26" rx="13" fill="#D1FAE5" stroke="#059669" stroke-width="0.8"/>
    <text x="65" y="211" fill="#065F46" text-anchor="middle" font-weight="700">Django 5.2</text>

    <rect x="114" y="194" width="55" height="26" rx="13" fill="#E2E8F0"/>
    <text x="141" y="211" fill="#334155" text-anchor="middle" font-weight="600">DRF</text>

    <rect x="177" y="194" width="82" height="26" rx="13" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
    <text x="218" y="211" fill="#0F172A" text-anchor="middle" font-weight="700">Next.js 16</text>

    <rect x="267" y="194" width="86" height="26" rx="13" fill="#E2E8F0"/>
    <text x="310" y="211" fill="#334155" text-anchor="middle" font-weight="600">PostgreSQL</text>

    <rect x="361" y="194" width="60" height="26" rx="13" fill="#FEE2E2" stroke="#EF4444" stroke-width="0.8"/>
    <text x="391" y="211" fill="#991B1B" text-anchor="middle" font-weight="700">Redis</text>

    <rect x="429" y="194" width="100" height="26" rx="13" fill="#E2E8F0"/>
    <text x="479" y="211" fill="#334155" text-anchor="middle" font-weight="600">Celery + Beat</text>

    <rect x="537" y="194" width="65" height="26" rx="13" fill="#E2E8F0"/>
    <text x="569" y="211" fill="#334155" text-anchor="middle" font-weight="600">Docker</text>

    <rect x="610" y="194" width="58" height="26" rx="13" fill="#E2E8F0"/>
    <text x="639" y="211" fill="#334155" text-anchor="middle" font-weight="600">Nginx</text>

    <rect x="676" y="194" width="130" height="26" rx="13" fill="#E2E8F0"/>
    <text x="741" y="211" fill="#334155" text-anchor="middle" font-weight="600">Stripe · eSewa · CI</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="24" y1="238" x2="806" y2="238" stroke="#E2E8F0" stroke-width="1"/>
</svg>