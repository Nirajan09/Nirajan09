<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="p3BorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#D97706;#7C3AED;#0284C7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#D97706">
        <animate attributeName="stop-color" values="#D97706;#7C3AED;#0284C7;#D97706" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#0284C7;#D97706;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="p3ScanLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .scan {
      animation: sweep 6s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.15; }
      80% { opacity: 0.15; }
      100% { transform: translateY(260px); opacity: 0; }
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="828" height="258" rx="14" fill="#F8FAFC" stroke="url(#p3BorderLight)" stroke-width="1.8"/>

  <!-- Scanning line -->
  <rect x="2" y="0" width="826" height="2" fill="url(#p3ScanLight)" class="scan"/>

  <!-- Header: Status & Index -->
  <g class="mono" font-size="11">
    <rect x="24" y="22" width="185" height="24" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
    <circle cx="36" cy="34" r="4" fill="#059669"/>
    <text x="48" y="38" fill="#065F46" font-weight="700" letter-spacing="0.5">PROJECT_03 // STATUS: LIVE</text>

    <text x="806" y="38" fill="#64748B" text-anchor="end" font-weight="600">VERCEL DEPLOYED</text>
  </g>

  <!-- Title & Cursor -->
  <g class="mono">
    <text x="24" y="82" fill="#0F172A" font-size="22" font-weight="700" letter-spacing="-0.5">
      Pixify<tspan fill="#D97706" class="cursor">_</tspan>
    </text>
    <text x="24" y="108" fill="#475569" font-size="13" font-weight="500">
      Decoupled image sharing platform with memory-buffered uploads and synchronized asset cleanup.
    </text>
  </g>

  <!-- 3 Feature Chips -->
  <g class="mono" font-size="11">
    <!-- Chip 1 -->
    <rect x="24" y="132" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="36" cy="147" r="3" fill="#0284C7"/>
    <text x="46" y="151" fill="#1E293B" font-weight="600">Multer Streamed to Cloudinary CDN</text>

    <!-- Chip 2 -->
    <rect x="299" y="132" width="250" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="311" cy="147" r="3" fill="#D97706"/>
    <text x="321" y="151" fill="#1E293B" font-weight="600">Ownership-Verified Asset Deletes</text>

    <!-- Chip 3 -->
    <rect x="559" y="132" width="247" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="571" cy="147" r="3" fill="#7C3AED"/>
    <text x="581" y="151" fill="#1E293B" font-weight="600">Paginated Feeds &amp; Radix Modals</text>
  </g>

  <!-- Stack Pills Row -->
  <g class="mono" font-size="10.5">
    <!-- Next.js 16 -->
    <rect x="24" y="194" width="82" height="26" rx="13" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
    <text x="65" y="211" fill="#0F172A" text-anchor="middle" font-weight="700">Next.js 16</text>

    <!-- React 19 -->
    <rect x="114" y="194" width="76" height="26" rx="13" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>
    <text x="152" y="211" fill="#0369A1" text-anchor="middle" font-weight="700">React 19</text>

    <!-- Tailwind v4 -->
    <rect x="198" y="194" width="85" height="26" rx="13" fill="#E2E8F0"/>
    <text x="240" y="211" fill="#334155" text-anchor="middle" font-weight="600">Tailwind v4</text>

    <!-- Express 5 -->
    <rect x="291" y="194" width="82" height="26" rx="13" fill="#E2E8F0"/>
    <text x="332" y="211" fill="#334155" text-anchor="middle" font-weight="600">Express 5</text>

    <!-- Mongoose -->
    <rect x="381" y="194" width="76" height="26" rx="13" fill="#D1FAE5" stroke="#059669" stroke-width="0.8"/>
    <text x="419" y="211" fill="#065F46" text-anchor="middle" font-weight="700">Mongoose</text>

    <!-- JWT + bcrypt -->
    <rect x="465" y="194" width="98" height="26" rx="13" fill="#E2E8F0"/>
    <text x="514" y="211" fill="#334155" text-anchor="middle" font-weight="600">JWT · bcrypt</text>

    <!-- Cloudinary -->
    <rect x="571" y="194" width="85" height="26" rx="13" fill="#E2E8F0"/>
    <text x="613" y="211" fill="#334155" text-anchor="middle" font-weight="600">Cloudinary</text>

    <!-- Multer -->
    <rect x="664" y="194" width="62" height="26" rx="13" fill="#E2E8F0"/>
    <text x="695" y="211" fill="#334155" text-anchor="middle" font-weight="600">Multer</text>

    <!-- Radix UI -->
    <rect x="734" y="194" width="72" height="26" rx="13" fill="#E2E8F0"/>
    <text x="770" y="211" fill="#334155" text-anchor="middle" font-weight="600">Radix UI</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="24" y1="238" x2="806" y2="238" stroke="#E2E8F0" stroke-width="1"/>
</svg>
