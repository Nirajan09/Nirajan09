<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="p3BorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#F59E0B;#8B5CF6;#00F2FE" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#8B5CF6;#00F2FE;#F59E0B" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#00F2FE;#F59E0B;#8B5CF6" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="p3ScanDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .scan {
      animation: sweep 6s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.2; }
      80% { opacity: 0.2; }
      100% { transform: translateY(260px); opacity: 0; }
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="828" height="258" rx="14" fill="#080C14" stroke="url(#p3BorderDark)" stroke-width="1.8"/>

  <!-- Scanning line -->
  <rect x="2" y="0" width="826" height="2" fill="url(#p3ScanDark)" class="scan"/>

  <!-- Header: Status & Index -->
  <g class="mono" font-size="11">
    <rect x="24" y="22" width="220" height="24" rx="12" fill="#0D1525" stroke="#00F2FE" stroke-opacity="0.5"/>
    <circle cx="36" cy="34" r="4" fill="#00F2FE"/>
    <text x="48" y="38" fill="#00F2FE" font-weight="700" letter-spacing="0.5">PROJECT_03 // STATUS: SOURCE</text>

    <text x="806" y="38" fill="#64748B" text-anchor="end" font-weight="600">DECOUPLED ARCHITECTURE</text>
  </g>

  <!-- Title & Cursor -->
  <g class="mono">
    <text x="24" y="82" fill="#F8FAFC" font-size="22" font-weight="700" letter-spacing="-0.5">
      Pixify<tspan fill="#F59E0B" class="cursor">_</tspan>
    </text>
    <text x="24" y="108" fill="#94A3B8" font-size="13" font-weight="400">
      Decoupled image sharing platform with memory-buffered uploads and synchronized asset cleanup.
    </text>
  </g>

  <!-- 3 Feature Chips -->
  <g class="mono" font-size="11">
    <!-- Chip 1 -->
    <rect x="24" y="132" width="265" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="36" cy="147" r="3" fill="#00F2FE"/>
    <text x="46" y="151" fill="#E2E8F0">Multer Streamed to Cloudinary CDN</text>

    <!-- Chip 2 -->
    <rect x="299" y="132" width="250" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="311" cy="147" r="3" fill="#F59E0B"/>
    <text x="321" y="151" fill="#E2E8F0">Ownership-Verified Asset Deletes</text>

    <!-- Chip 3 -->
    <rect x="559" y="132" width="247" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="571" cy="147" r="3" fill="#8B5CF6"/>
    <text x="581" y="151" fill="#E2E8F0">Paginated Feeds &amp; Radix Modals</text>
  </g>

  <!-- Stack Pills Row -->
  <g class="mono" font-size="10.5">
    <!-- Next.js 16 -->
    <rect x="24" y="194" width="82" height="26" rx="13" fill="#0D1525" stroke="#F8FAFC" stroke-opacity="0.8" stroke-width="0.8"/>
    <text x="65" y="211" fill="#F8FAFC" text-anchor="middle" font-weight="600">Next.js 16</text>

    <!-- React 19 -->
    <rect x="114" y="194" width="76" height="26" rx="13" fill="#0B233A" stroke="#00F2FE" stroke-width="0.8"/>
    <text x="152" y="211" fill="#BAE6FD" text-anchor="middle" font-weight="600">React 19</text>

    <!-- Tailwind v4 -->
    <rect x="198" y="194" width="85" height="26" rx="13" fill="#1E293B"/>
    <text x="240" y="211" fill="#CBD5E1" text-anchor="middle">Tailwind v4</text>

    <!-- Express 5 -->
    <rect x="291" y="194" width="82" height="26" rx="13" fill="#1E293B"/>
    <text x="332" y="211" fill="#CBD5E1" text-anchor="middle">Express 5</text>

    <!-- Mongoose -->
    <rect x="381" y="194" width="76" height="26" rx="13" fill="#092E20" stroke="#10B981" stroke-width="0.8"/>
    <text x="419" y="211" fill="#A7F3D0" text-anchor="middle" font-weight="600">Mongoose</text>

    <!-- JWT + bcrypt -->
    <rect x="465" y="194" width="98" height="26" rx="13" fill="#1E293B"/>
    <text x="514" y="211" fill="#CBD5E1" text-anchor="middle">JWT · bcrypt</text>

    <!-- Cloudinary -->
    <rect x="571" y="194" width="85" height="26" rx="13" fill="#1E293B"/>
    <text x="613" y="211" fill="#CBD5E1" text-anchor="middle">Cloudinary</text>

    <!-- Multer -->
    <rect x="664" y="194" width="62" height="26" rx="13" fill="#1E293B"/>
    <text x="695" y="211" fill="#CBD5E1" text-anchor="middle">Multer</text>

    <!-- Radix UI -->
    <rect x="734" y="194" width="72" height="26" rx="13" fill="#1E293B"/>
    <text x="770" y="211" fill="#CBD5E1" text-anchor="middle">Radix UI</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="24" y1="238" x2="806" y2="238" stroke="#1E293B" stroke-width="1"/>
</svg>
