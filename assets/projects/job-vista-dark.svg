<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="p2BorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#00F2FE;#F59E0B;#8B5CF6" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#F59E0B;#8B5CF6;#00F2FE" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#8B5CF6;#00F2FE;#F59E0B" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="p2ScanDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .scan {
      animation: sweep 6s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.2; }
      80% { opacity: 0.2; }
      100% { transform: translateY(260px); opacity: 0; }
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="828" height="258" rx="14" fill="#080C14" stroke="url(#p2BorderDark)" stroke-width="1.8"/>

  <!-- Scanning line -->
  <rect x="2" y="0" width="826" height="2" fill="url(#p2ScanDark)" class="scan"/>

  <!-- Header: Status & Index -->
  <g class="mono" font-size="11">
    <rect x="24" y="22" width="240" height="24" rx="12" fill="#140D28" stroke="#10B981" stroke-opacity="0.8"/>
    <circle cx="36" cy="34" r="4" fill="#10B981"/>
    <text x="48" y="38" fill="#10B981" font-weight="700" letter-spacing="0.5">PROJECT_02 // STATUS: LIVE</text>

    <text x="806" y="38" fill="#64748B" text-anchor="end" font-weight="600">VERCEL DEPLOYED</text>
  </g>

  <!-- Title & Cursor -->
  <g class="mono">
    <text x="24" y="82" fill="#F8FAFC" font-size="22" font-weight="700" letter-spacing="-0.5">
      JobVista<tspan fill="#8B5CF6" class="cursor">_</tspan>
    </text>
    <text x="24" y="108" fill="#94A3B8" font-size="13" font-weight="400">
      Role-based job portal with membership limits, filters, applications, and resume review.
    </text>
  </g>

  <!-- 3 Feature Chips -->
  <g class="mono" font-size="11">
    <!-- Chip 1 -->
    <rect x="24" y="132" width="255" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="36" cy="147" r="3" fill="#00F2FE"/>
    <text x="46" y="151" fill="#E2E8F0">Candidate &amp; Recruiter Onboarding</text>

    <!-- Chip 2 -->
    <rect x="289" y="132" width="250" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="301" cy="147" r="3" fill="#8B5CF6"/>
    <text x="311" y="151" fill="#E2E8F0">Stripe Membership Post Limits</text>

    <!-- Chip 3 -->
    <rect x="549" y="132" width="257" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="561" cy="147" r="3" fill="#10B981"/>
    <text x="571" y="151" fill="#E2E8F0">Supabase Resumes &amp; Status Tracking</text>
  </g>

  <!-- Stack Pills Row -->
  <g class="mono" font-size="10.5">
    <rect x="24" y="194" width="82" height="26" rx="13" fill="#0D1525" stroke="#F8FAFC" stroke-opacity="0.8" stroke-width="0.8"/>
    <text x="65" y="211" fill="#F8FAFC" text-anchor="middle" font-weight="600">Next.js 16</text>

    <rect x="114" y="194" width="76" height="26" rx="13" fill="#0B233A" stroke="#00F2FE" stroke-width="0.8"/>
    <text x="152" y="211" fill="#BAE6FD" text-anchor="middle" font-weight="600">React 19</text>

    <rect x="198" y="194" width="115" height="26" rx="13" fill="#1E293B"/>
    <text x="255" y="211" fill="#CBD5E1" text-anchor="middle">Server Actions</text>

    <rect x="321" y="194" width="76" height="26" rx="13" fill="#1E293B"/>
    <text x="359" y="211" fill="#CBD5E1" text-anchor="middle">Radix UI</text>

    <rect x="405" y="194" width="60" height="26" rx="13" fill="#1E293B"/>
    <text x="435" y="211" fill="#CBD5E1" text-anchor="middle">Clerk</text>

    <rect x="473" y="194" width="105" height="26" rx="13" fill="#092E20" stroke="#10B981" stroke-width="0.8"/>
    <text x="525" y="211" fill="#A7F3D0" text-anchor="middle" font-weight="600">MongoDB Atlas</text>

    <rect x="586" y="194" width="76" height="26" rx="13" fill="#1E293B"/>
    <text x="624" y="211" fill="#CBD5E1" text-anchor="middle">Mongoose</text>

    <rect x="670" y="194" width="60" height="26" rx="13" fill="#241442" stroke="#8B5CF6" stroke-width="0.8"/>
    <text x="700" y="211" fill="#DDD6FE" text-anchor="middle" font-weight="600">Stripe</text>

    <rect x="738" y="194" width="68" height="26" rx="13" fill="#1E293B"/>
    <text x="772" y="211" fill="#CBD5E1" text-anchor="middle">Supabase</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="24" y1="238" x2="806" y2="238" stroke="#1E293B" stroke-width="1"/>
</svg>