<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 255" width="100%" height="255" fill="none">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Background Card -->
  <rect x="1" y="1" width="828" height="253" rx="12" fill="#080C14" stroke="url(#termBorder)" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M1 13C1 6.37258 6.37258 1 13 1H817C823.627 1 829 6.37258 829 13V38H1V13Z" fill="url(#headerGrad)"/>
  <line x1="1" y1="38" x2="829" y2="38" stroke="#334155" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="22" cy="19" r="5.5" fill="#EF4444"/>
  <circle cx="40" cy="19" r="5.5" fill="#F59E0B"/>
  <circle cx="58" cy="19" r="5.5" fill="#10B981"/>

  <!-- Title -->
  <text x="415" y="24" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle" class="mono">nirajan@kathmandu: ~/about</text>

  <!-- Terminal Content -->
  <g class="mono" font-size="12.5">
    <text x="24" y="66">
      <tspan fill="#00F2FE" font-weight="700">nirajan@kathmandu</tspan>
      <tspan fill="#64748B">:</tspan>
      <tspan fill="#F59E0B">~</tspan>
      <tspan fill="#64748B">$ </tspan>
      <tspan fill="#F8FAFC" font-weight="600">cat about.txt</tspan>
    </text>

    <text x="24" y="96">
      <tspan fill="#8B5CF6">name</tspan><tspan fill="#64748B"> ...... </tspan>
      <tspan fill="#F8FAFC" font-weight="600">Nirajan Tiwari</tspan>
    </text>

    <text x="24" y="121">
      <tspan fill="#8B5CF6">role</tspan><tspan fill="#64748B"> ...... </tspan>
      <tspan fill="#00F2FE">Full Stack Developer @ Cherdung Info Tech</tspan>
      <tspan fill="#64748B"> (since Apr 2026)</tspan>
    </text>

    <text x="24" y="146">
      <tspan fill="#8B5CF6">previous</tspan><tspan fill="#64748B"> .. </tspan>
      <tspan fill="#CBD5E1">Associate Full Stack &amp; Frontend Intern @ Vyomite IT Services</tspan>
    </text>

    <text x="24" y="171">
      <tspan fill="#8B5CF6">degree</tspan><tspan fill="#64748B"> .... </tspan>
      <tspan fill="#CBD5E1">BSc CSIT, Orchid International College (2022 - 2026)</tspan>
    </text>

    <text x="24" y="196">
      <tspan fill="#8B5CF6">base</tspan><tspan fill="#64748B"> ...... </tspan>
      <tspan fill="#E2E8F0">Kathmandu, Nepal</tspan>
    </text>

    <text x="24" y="221">
      <tspan fill="#8B5CF6">rule</tspan><tspan fill="#64748B"> ...... </tspan>
      <tspan fill="#F59E0B">try { ship() } catch { blame(cache) }</tspan>
    </text>

    <text x="24" y="244">
      <tspan fill="#00F2FE" font-weight="700">nirajan@kathmandu</tspan>
      <tspan fill="#64748B">:</tspan>
      <tspan fill="#F59E0B">~</tspan>
      <tspan fill="#64748B">$ </tspan>
      <tspan fill="#00F2FE" class="cursor" font-weight="700">█</tspan>
    </text>
  </g>
</svg>