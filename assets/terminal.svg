      <tspan fill="#00F2FE" font-weight="700">nirajan@kathmandu</tspan>
      <tspan fill="#64748B">:</tspan>
      <tspan fill="#F59E0B">~</tspan>
      <tspan fill="#64748B">$ </tspan>
      <tspan fill="#F8FAFC">git log --oneline -1</tspan>
      <tspan fill="#00F2FE" class="cursor" font-weight="700"> █</tspan>
